[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shardelix"
version = "15.0.0"
description = "Classical digital image and document fragment reconstruction, blind by default"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daydreamer2812" }]
keywords = ["computer-vision", "jigsaw", "document-reconstruction", "opencv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.26", "scipy>=1.11", "Pillow>=10"]

[project.urls]
Homepage = "https://github.com/Daydreamer2812/Shardelix"
Repository = "https://github.com/Daydreamer2812/Shardelix"
Issues = "https://github.com/Daydreamer2812/Shardelix/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
reference = ["opencv-python-headless>=4.8"]  # optional tiled SIFT acceleration
pdf = ["PyMuPDF>=1.23"]
ui = []  # Studio uses the standard library

[project.scripts]
shardelix = "shardelix.reconstruction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.setuptools.package-data]
shardelix = ["studio.html"]
