name: Browser engine smoke
on:
  push:
    branches: [main, master, v13-dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.15'
      - run: python scripts/build_web.py --out build/pages --wasm
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Real WebAssembly browser workflow
        run: |
          python -m http.server 8767 --bind 127.0.0.1 --directory build/pages > /tmp/pages.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8767/ -o /dev/null && break || sleep 1; done
          EXPECT_CPP="C++ / WASM" QA_SCREENSHOT=/tmp/studio.png node scripts/qa_studio.cjs http://127.0.0.1:8767/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-smoke-evidence
          path: |
            /tmp/pages.log
            /tmp/studio.png
            /tmp/studio-generator.png
            /tmp/studio-mobile.png
