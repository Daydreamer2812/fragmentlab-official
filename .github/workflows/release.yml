name: Publish versioned research release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'pyproject.toml'
      - 'docs/releases/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shardelix-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve release version and check existing tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          test -f "docs/releases/$tag.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: emscripten-core/setup-emsdk@v15
        if: steps.version.outputs.publish == 'true'
        with:
          version: '4.0.15'
      - name: Build and verify release archives
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pip install -e ".[dev]"
          python scripts/build_native.py
          ruff check --select F821,F822,F823,F811 src tests benchmarks scripts examples
          shardelix doctor --require-native
          COVERAGE_FILE=.coverage.native python -m coverage run -m unittest discover -s tests -t .
          SHARDELIX_CORE=python COVERAGE_FILE=.coverage.python python -m coverage run -m unittest discover -s tests -t .
          python -m coverage combine
          python -m coverage report
          mkdir -p dist
          python -m build --sdist --wheel --outdir dist/packages
          python -m twine check dist/packages/*
          git archive --format=zip --prefix="shardelix-$TAG/" -o "dist/shardelix-$TAG-source.zip" "$GITHUB_SHA"
          python scripts/build_web.py --out build/release-web --wasm
          test -s build/release-web/fl_core.wasm
          test -s build/release-web/fl_core.js
          cat > build/release-web/START_HERE.txt <<'EOF'
          Shardelix Web Studio
          With Python 3 installed, open a terminal in this directory, then run:
            python -m http.server 8767 --bind 127.0.0.1
          Open http://127.0.0.1:8767/ in your browser.
          First use needs internet access to retrieve the pinned Pyodide dependencies.
          Input images remain in the browser worker.
          Research source: https://github.com/${{ github.repository }}
          EOF
          (cd build/release-web && zip -qr "../../dist/shardelix-$TAG-web.zip" .)
          unzip -t "dist/shardelix-$TAG-source.zip"
          unzip -t "dist/shardelix-$TAG-web.zip"
          cp dist/packages/*.whl dist/packages/*.tar.gz dist/
          (cd dist && sha256sum "shardelix-$TAG-source.zip" "shardelix-$TAG-web.zip" *.whl *.tar.gz > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish GitHub release and assets
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "dist/shardelix-$TAG-source.zip" "dist/shardelix-$TAG-web.zip" dist/packages/*.whl dist/packages/*.tar.gz dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Shardelix $TAG — C++ / WebAssembly" \
            --notes-file "docs/releases/$TAG.md" --latest
