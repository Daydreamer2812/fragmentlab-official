name: Blind CV regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Build C++20 native kernels
        run: python scripts/build_native.py
      - name: Algorithm regression (C++ backend)
        run: python -m unittest discover -s tests/algorithms -t .
      - name: Web build regression
        run: python -m unittest discover -s tests/integration -t .
      - name: Reference backend parity / fallback
        env:
          SHARDELIX_CORE: python
        run: python -m unittest discover -s tests/algorithms -t .
