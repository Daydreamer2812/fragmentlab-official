name: Blind CV regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Check static Python errors
        run: ruff check --select F821,F822,F823,F811 src tests benchmarks scripts examples
      - name: Build C++20 native kernels
        run: python scripts/build_native.py
      - name: Native backend regression
        env:
          COVERAGE_FILE: .coverage.native
        run: |
          shardelix doctor --require-native
          python -m coverage run -m unittest discover -s tests -t .
      - name: Reference backend parity / fallback
        env:
          SHARDELIX_CORE: python
          COVERAGE_FILE: .coverage.python
        run: |
          shardelix doctor
          python -m coverage run -m unittest discover -s tests -t .
      - name: Combined coverage gate
        run: |
          python -m coverage combine
          python -m coverage report
          python -m coverage xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
